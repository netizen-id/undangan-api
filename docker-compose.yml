services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: undangan-fsmzni
        depends_on:
            - db
        networks:
            - undangan

    db:
        image: postgres:latest
        container_name: undangan-db
        environment:
            POSTGRES_DB: undangan
            POSTGRES_USER: undangan
            POSTGRES_PASSWORD: Lakonage13@
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - undangan

    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        container_name: undangan-nginx
        ports:
            - 8080:80
        networks:
            - undangan
        depends_on:
            - app

volumes:
    postgres_data:


networks:
    undangan:
        driver: bridge
